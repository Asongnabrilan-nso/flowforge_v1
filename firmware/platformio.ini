; FlowForge firmware - PlatformIO project
; Board: Arduino Mega 2560 + RAMPS 1.6 shield

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.13
    adafruit/Adafruit GFX Library @ ^1.11.11
    adafruit/Adafruit BusIO @ ^1.16.1
build_flags =
    -Wall
